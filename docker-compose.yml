services:
  open-sprinkler-mcp:
    image: ghcr.io/koolsb/open-sprinkler-mcp:latest
    # Or build locally:
    # build: .
    ports:
      - "3000:3000"
    environment:
      # The hostname, IP address, or URL of your OpenSprinkler device
      OS_HOST: "192.168.1.100"
      # Plain-text device password (default: opendoor)
      OS_PASSWORD: "opendoor"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
